  - id: "jewad1"
    src: figures/jewadsalim1.png
    label: "Title Unknown"
    credit: "Mathaf: Arab Museum of Modern Art, Doha"
    caption: "Jewad Selim, Title Unknown, no date, watercolour on paper, 34.1 × 25.2 cm. Mathaf: Arab Museum of Modern Art, Doha."
    alt: "Watercolour composition with two stylised figures surrounded by geometric symbols and areas of red-orange, ochre, black, brown, and white."
    zoom: true

  - id: "jewad2"
    src: figures/jewadsalim2.jpg
    label: "Title Unknown"
