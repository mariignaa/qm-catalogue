  - id: "nada-shabout"
    src: figures/nada_shabout.jpg
    label: "Nada Shabout"
    credit: "Mathaf: Arab Museum of Modern Art, Doha"
    caption: "Dr. Nada Shabout is a regents professor of art history and the coordinator of the Contemporary Arab and Muslim Cultural Studies Initiative (CAMCSI) at the University of North Texas."
    alt: "Nada Shabout"
    zoom: false

  - id: "lange-house"
    src: figures/lange-house.jpg
    caption: "Dorothea Lange. *Abandoned Dust Bowl Home*, about 1935–1940."
    credit: The J. Paul Getty Museum, Los Angeles
    alt: "An abandoned-looking wooden shack darkly colored and standing straight against a light, empty expanse of sparsely vegetated dessert and cloudy sky."

