# Title & Description
title: What Lingers in the Artist Mind
subtitle: Experiments and Legacies of the Baghdad Modern Art Group
# reading_line: What Lingers in the Artist Mind
short_title: What Lingers in the Artist Mind

description:
  one_line:
  full: "What Lingers in the Artist Mind: Experiments and Legacies of the Baghdad Modern Art Group explores the history, development, and lasting influence of the Baghdad Modern Art Group, an influential Iraqi art collective initiated in 1951 by artists Jewad Selim and Shakir Hassan Al Said. The group brought together ideas rooted in Iraq’s cultural and artistic history with modern approaches to art, while positioning Baghdad within wider conversations around modernism. Curated by Nada Shabout, the exhibition brings together artworks and archival materials to trace the group’s changing membership, artistic development, exhibitions, and influence on later generations of Iraqi artists. It also examines how war and instability in Iraq resulted in the loss and fragmentation of artworks and archives, making parts of the group’s history difficult to reconstruct. Through both what survives and what has been lost, the exhibition creates space to reconsider the Baghdad Modern Art Group’s place within Iraqi art and broader histories of modernism."

